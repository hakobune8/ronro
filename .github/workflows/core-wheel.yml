name: Core wheel boundary

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install source-side verification requirements
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip install --disable-pip-version-check build==1.3.0

      - name: Build source distribution and wheel
        run: python -m build --outdir "$RUNNER_TEMP/ronro-core-dist"

      - name: Record the single wheel path
        shell: bash
        run: |
          set -euo pipefail
          wheels=("$RUNNER_TEMP"/ronro-core-dist/ronro_core-*.whl)
          sdists=("$RUNNER_TEMP"/ronro-core-dist/ronro_core-*.tar.gz)
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
          test -f "${wheels[0]}"
          test -f "${sdists[0]}"
          echo "WHEEL_PATH=${wheels[0]}" >> "$GITHUB_ENV"
          echo "SDIST_PATH=${sdists[0]}" >> "$GITHUB_ENV"

      - name: Install wheel outside the source tree
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/ronro-core-clean"
          "$RUNNER_TEMP/ronro-core-clean/bin/python" -m pip install --disable-pip-version-check \
            "$WHEEL_PATH"

      - name: Verify inventory, clean import, Replay, Canvas and PDF
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_core_wheel.py \
            "$WHEEL_PATH" \
            "$RUNNER_TEMP/ronro-core-clean/bin/python" \
            "$SDIST_PATH"
