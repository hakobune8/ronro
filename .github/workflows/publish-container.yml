name: Publish RONRO container

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Git tag to build and publish
        required: true
        default: v0.1.0-pilot
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish GHCR image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_TAG: ${{ inputs.source_tag || github.ref_name }}
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ronro

    steps:
      - name: Check out the requested release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_tag || github.ref }}
          fetch-depth: 0

      - name: Verify source tag identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SOURCE_TAG}"
          git fetch --force --tags origin
          test "$(git rev-parse "${SOURCE_TAG}^{commit}")" = "$(git rev-parse HEAD)"
          echo "Building ${SOURCE_TAG} from $(git rev-parse HEAD)"

      - name: Set image metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.SOURCE_TAG }}
          build-args: |
            APP_VERSION=${{ env.SOURCE_TAG }}
            VCS_REF=${{ env.SOURCE_SHA }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          provenance: mode=max
          sbom: true

      - name: Report immutable image identity
        run: echo "Published ${IMAGE_NAME}:${SOURCE_TAG}@${{ steps.build.outputs.digest }}"
