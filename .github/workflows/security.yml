name: Security checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-security:
    name: Python dependency and code checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install runtime and audit tools
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip install --disable-pip-version-check pip-audit==2.9.0 bandit==1.8.6

      - name: Compile Python sources
        run: python -m compileall -q prototype

      - name: Audit dependencies
        run: pip-audit --requirement requirements-dev.txt

      - name: Run Bandit
        run: bandit -r prototype -ll

  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: python

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
