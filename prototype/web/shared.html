<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>論路 — 論点図</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Yu Gothic", YuGothic, sans-serif;
      --ink: #17202a;
      --muted: #596a7b;
      --line: #d9e1e9;
      --canvas: #f5f8fb;
      --panel: #ffffff;
      --blue: #2563eb;
      --blue-soft: #eaf2ff;
      --amber: #a16207;
      --amber-soft: #fffdf8;
      --violet: #6d4bcc;
      --violet-soft: #faf7ff;
      --green: #18824b;
      --green-soft: #f4fbf7;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body { margin: 0; overflow: hidden; background: var(--canvas); color: var(--ink); }
    .shared-shell { display: grid; grid-template-rows: 86px 46px minmax(0, 1fr) 54px; width: 100vw; height: 100vh; padding: 0 34px 18px; }
    .shared-header { display: flex; align-items: center; justify-content: space-between; gap: 24px; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: baseline; gap: 14px; min-width: 0; }
    .brand-name { font-size: 28px; font-weight: 780; letter-spacing: -.03em; white-space: nowrap; }
    .brand-goal { color: var(--muted); font-size: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .shared-status { display: inline-flex; align-items: center; gap: 8px; flex: 0 0 auto; padding: 10px 15px; border: 1px solid #cbd7e3; border-radius: 999px; background: #fff; color: #36516d; font-size: 18px; line-height: 1.4; font-weight: 700; }
    .shared-status.busy { border-color: #e6c778; background: var(--amber-soft); color: #8a5b07; }
    .shared-status.updated { border-color: #a9d8bd; background: var(--green-soft); color: #146b3d; }
    .shared-status.delayed { border-color: #e6b0a6; background: #fff4f1; color: #9d3528; }
    .flow-band { display: grid; grid-template-columns: 126px minmax(0,1fr); grid-template-rows: 1fr 1fr; align-items: center; column-gap: 16px; min-width: 0; border-bottom: 1px solid var(--line); color: var(--muted); }
    .flow-title { grid-row: 1 / 3; }
    .flow-row { display: flex; align-items: center; gap: 12px; min-width: 0; overflow: hidden; }
    .flow-row[hidden] { display: none; }
    .flow-band:not(.has-discussion) { grid-template-rows: 1fr; }
    .flow-band:not(.has-discussion) .flow-title { grid-row: 1; }
    .flow-level { flex: 0 0 auto; min-width: 100px; font-size: 17px; color: #65788a; }
    .flow-discussion .flow-item { font-size: 23px; }
    .flow-title { flex: 0 0 auto; font-size: 20px; font-weight: 750; white-space: nowrap; }
    .flow-list { display: flex; align-items: center; gap: 10px; min-width: 0; overflow: hidden; }
    .flow-item { flex: 0 0 auto; max-width: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 5px 2px 6px; border-bottom: 2px solid transparent; border-radius: 3px; background: transparent; color: #40586f; font-size: 20px; line-height: 1.4; }
    .flow-item.current { border-bottom-color: #9bb9eb; color: #174ea6; font-weight: 750; }
    .flow-item.current.just-updated { border-bottom-color: #3774d3; background: #eaf2ff; }
    .flow-item.ellipsis { max-width: 28px; color: #728496; font-size: 22px; letter-spacing: .08em; }
    .flow-arrow { flex: 0 0 auto; color: #728496; font-size: 22px; }
    .shared-main { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 24px; min-height: 0; padding: 24px 0 18px; }
    .topic-hero { display: flex; min-width: 0; min-height: 0; flex-direction: column; justify-content: space-between; padding: 34px 38px 28px; border: 1px solid #bcd2f3; border-radius: 20px; background: linear-gradient(145deg, #ffffff 0%, #f8fbff 100%); box-shadow: 0 8px 24px rgba(45, 77, 112, .05); }
    .topic-kicker { color: var(--blue); font-size: 20px; font-weight: 750; letter-spacing: .02em; }
    .topic-title { max-width: 1000px; margin: 12px 0 28px; font-size: 60px; font-weight: 800; letter-spacing: -.045em; line-height: 1.15; overflow-wrap: anywhere; }
    .topic-items { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-content: start; max-width: 1080px; }
    .topic-item { min-height: 82px; padding: 16px 18px; border: 1px solid #d3deea; border-radius: 13px; background: #fff; color: #273d52; font-size: 24px; font-weight: 650; line-height: 1.42; overflow-wrap: anywhere; }
    .topic-item.idea { border-left: 4px solid #8ea3b8; }
    .topic-item.option { border-left: 4px solid #8c9bd0; }
    .topic-item.concern { border-left: 4px solid #c29a52; background: #fffefa; }
    .topic-empty { padding: 18px 20px; border: 1px dashed #c6d4e2; border-radius: 12px; color: var(--muted); font-size: 20px; line-height: 1.45; }
    .topic-more { grid-column: 1 / -1; padding: 2px 4px; color: #53697d; font-size: 18px; line-height: 1.4; }
    .past-section { margin-top: 22px; }
    .section-label { margin-bottom: 9px; color: #4f6374; font-size: 18px; font-weight: 750; }
    .past-topics { display: flex; flex-wrap: wrap; gap: 9px; }
    .past-topic { padding: 8px 14px; border: 1px solid #d4dee8; border-radius: 999px; background: #f7f9fb; color: #53697d; font-size: 18px; line-height: 1.4; }
    .side-stack { display: grid; grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 14px; min-height: 0; }
    .side-card { min-height: 0; overflow: hidden; padding: 22px 24px; border: 1px solid #dfe5eb; border-left-width: 4px; border-radius: 14px; background: #fff; box-shadow: none; }
    .side-card h2 { margin: 0 0 7px; font-size: 26px; line-height: 1.2; letter-spacing: -.02em; }
    .side-card.candidate { border-left-color: #c8a14d; }
    .side-card.open { border-left-color: #9b87d2; }
    .side-card.action { border-left-color: #79b28f; }
    .side-subtitle { margin-bottom: 12px; color: #5f6f7e; font-size: 18px; line-height: 1.4; }
    .candidate .side-subtitle { color: #876d2c; }
    .side-list { display: flex; flex-direction: column; gap: 9px; margin: 0; padding: 0; list-style: none; }
    .side-list li { display: flex; gap: 10px; align-items: flex-start; color: #293e52; font-size: 22px; font-weight: 650; line-height: 1.42; overflow-wrap: anywhere; }
    .side-list li::before { flex: 0 0 auto; font-size: 22px; line-height: 1.42; }
    .candidate .side-list li::before { content: "◇"; color: var(--amber); }
    .open .side-list li::before { content: "?"; color: var(--violet); font-weight: 800; }
    .action .side-list li::before { content: "→"; color: var(--green); font-weight: 800; }
    .confirmed-line { margin-bottom: 12px; color: #176b3d; font-size: 20px; line-height: 1.4; font-weight: 700; }
    .confirmed-line::before { content: "✓ "; }
    .side-empty { color: var(--muted); font-size: 20px; line-height: 1.45; }
    .more-hint { color: #53697d !important; font-size: 18px !important; font-weight: 600 !important; }
    .more-hint::before { content: none !important; }
    .parking-line { margin-top: 16px; padding: 10px 13px; border-top: 1px solid #d5dde5; color: #53697d; font-size: 18px; line-height: 1.45; }
    .shared-footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; border-top: 1px solid var(--line); color: var(--muted); }
    .footer-note { font-size: 18px; line-height: 1.45; }
    .footer-status { flex: 0 0 auto; font-size: 18px; opacity: .45; }
    .error-state { grid-column: 1 / -1; display: grid; place-items: center; min-height: 240px; border: 1px dashed #c7d3df; border-radius: 18px; color: var(--muted); font-size: 22px; text-align: center; }
    html.capture-1920, html.capture-1920 body { width: 1920px; height: 1080px; min-width: 1920px; min-height: 1080px; }
    html.capture-1920 .shared-shell { width: 1920px; height: 1080px; }
    @media (max-width: 1350px) {
      .shared-shell { padding-left: 22px; padding-right: 22px; }
      .shared-main { grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; }
      .topic-hero { padding: 28px; }
      .topic-item { font-size: 22px; }
      .side-list li { font-size: 20px; }
    }
    html.capture-1920 .shared-shell { padding-left: 34px; padding-right: 34px; }
    html.capture-1920 .shared-main { grid-template-columns: minmax(0, 1fr) 420px; gap: 24px; }
    html.capture-1920 .topic-hero { padding: 34px 38px 28px; }
    html.capture-1920 .topic-item { font-size: 24px; }
    html.capture-1920 .side-list li { font-size: 22px; }
    [hidden] { display: none !important; }
    .shared-shell:not(.discussion-active) { grid-template-rows: 86px minmax(0,1fr) 54px; }
    .discussion-active.shared-shell { grid-template-rows: 60px minmax(0,1fr); padding: 0 40px 24px; }
    .discussion-active.has-flow.shared-shell { grid-template-rows: 60px 64px minmax(0,1fr); }
    .discussion-active.has-flow.has-discussion.shared-shell { grid-template-rows: 60px 104px minmax(0,1fr); }
    .discussion-active .brand, .discussion-active .shared-footer { display: none; }
    .discussion-active .shared-header { justify-content: flex-end; border: 0; }
    .discussion-active .shared-status { border: 0; background: transparent; font-size: 22px; font-weight: 500; }
    .shared-main.no-rail, html.capture-1920 .shared-main.no-rail { grid-template-columns: minmax(0,1fr); }
    .discussion-active .shared-main:not(.no-rail), html.capture-1920 .discussion-active .shared-main:not(.no-rail) { grid-template-columns: minmax(0,1fr) 460px; }
    .current-discussion { display: flex; flex-direction: column; gap: 18px; min-height: 0; min-width: 0; }
    .discussion-active .topic-items { grid-template-columns: repeat(2,minmax(0,1fr)); grid-template-rows: repeat(3,minmax(0,1fr)); flex: 1; max-width: none; min-height: 0; gap: 20px; }
    .discussion-active .topic-item, html.capture-1920 .discussion-active .topic-item { display: flex; align-items: center; font-size: 40px; line-height: 1.32; font-weight: 500; padding: 24px; min-height: 0; }
    .discussion-active .topic-item.just-updated, .persistent-item.just-updated { background: #eaf2ff; box-shadow: inset 0 0 0 3px #3774d3; }
    .discussion-active .topic-item.just-updated.concern { background: #fff4dc; box-shadow: inset 0 0 0 3px #a16207; }
    .discussion-active .topic-item, .persistent-item { transition: background-color .35s ease, box-shadow .35s ease; }
    @media (prefers-reduced-motion: reduce) { .discussion-active .topic-item, .persistent-item { transition: none; } }
    .discussion-active .shared-main:not(.no-rail) .topic-item { padding-inline: 14px; }
    .discussion-label { display: block; width: 100%; min-width: 0; }
    .discussion-active .topic-more { font-size: 23px; text-align: right; height: 38px; flex-shrink: 0; cursor: default; }
    .empty-slot { visibility: hidden; }
    .persistent-rail { padding-left: 24px; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; min-height: 0; }
    .persistent-section { padding: 12px 0; border-bottom: 1px solid var(--line); }
    .persistent-section h2 { font-size: 28px; margin: 0 0 12px; }
    .persistent-section.candidate h2 { color: #806338; }
    .persistent-section.confirmed h2 { color: #2e6350; }
    .persistent-item { font-size: 30px; line-height: 1.5; overflow-wrap: anywhere; text-wrap: pretty; }
    .persistent-section .topic-more { margin-top: 12px; font-size: 21px; }
    .discussion-active .flow-list { flex: 1; }
    .discussion-active .flow-item { flex: 0 1 auto; min-width: 0; font-size: 26px; }
    .discussion-active .flow-discussion .flow-item { font-size: 23px; }
    .discussion-active .flow-item.current { border-bottom-color: transparent; color: var(--ink); }
    .focused-main { display: grid; grid-template-columns: minmax(0,1fr) 420px; gap: 22px; min-height: 0; }
    .focused-map { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; padding: 28px 34px; }
    .focused-heading { margin: 0 0 18px; font-size: 28px; font-weight: 700; }
    .focused-content { display: flex; flex: 1; min-height: 0; flex-direction: column; justify-content: center; }
    .focused-row { display: flex; justify-content: center; align-items: stretch; gap: 16px; margin: 15px 0; }
    .focused-node { width: min(100%,520px); padding: 18px 22px; border: 2px solid #bbcfda; border-radius: 15px; background: #fff; font-size: 29px; line-height: 1.35; font-weight: 650; overflow-wrap: anywhere; }
    .focused-node.current { border: 4px solid #28668b; background: #f0f8fc; font-size: 37px; }
    .focused-sparse .focused-node { width: min(100%,700px); padding: 26px 30px; font-size: 34px; }
    .focused-sparse .focused-node.current { font-size: 45px; }
    .focused-sparse .focused-relation { font-size: 22px; }
    .focused-node.context { color: #425d6e; font-size: 25px; }
    .focused-node.argument { border-left: 6px solid #449777; font-size: 25px; }
    .focused-node.argument.opposes { border-left-color: #b97468; }
    .focused-relation { color: #516d7b; font-size: 20px; text-align: center; }
    .focused-argument-label { color: #286d52; font-size: 18px; font-weight: 600; margin-bottom: 5px; }
    .focused-node.opposes .focused-argument-label { color: #965249; }
    .focused-unlinked { margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--line); }
    .focused-unlinked h2 { margin: 0 0 12px; color: var(--muted); font-size: 21px; font-weight: 650; }
    .focused-unlinked-list { display: flex; gap: 14px; }
    .focused-unlinked-item { flex: 1; min-width: 0; padding: 16px 18px; border: 1px solid var(--line); border-radius: 13px; background: #fff; color: #354c60; font-size: 26px; line-height: 1.35; overflow-wrap: anywhere; }
    .focused-side { min-height: 0; display: flex; flex-direction: column; gap: 12px; }
    .focused-latest { flex: 0 0 auto; max-height: 34%; overflow: auto; padding: 20px 24px; border-radius: 16px; background: #edf3f6; }
    .focused-latest h2 { margin: 0 0 12px; font-size: 23px; }
    .focused-latest p { margin: 0; font-size: 23px; line-height: 1.5; overflow-wrap: anywhere; }
    .focused-side .persistent-rail { flex: 0 1 auto; max-height: calc(100% - 180px); overflow: hidden; padding: 10px 20px; border: 1px solid #d7e1e7; border-radius: 16px; background: #fff; }
    .focused-side .persistent-section { padding: 10px 0; }
    .focused-side .persistent-section h2 { font-size: 26px; margin-bottom: 6px; }
    .focused-side .persistent-item { font-size: 26px; line-height: 1.35; }
    .focused-side .side-empty { font-size: 20px; }
    .focused-side .action-details { font-size: 18px; color: #53697d; }
    /* Semantic Canvas: one world for Live and Final, with only the camera changing. */
    .canvas-active.shared-shell { --focus-accent: #2d78bb; grid-template-rows: 62px minmax(0,1fr); padding: 0 28px 22px; }
    .canvas-active .shared-header { justify-content: flex-start; gap: 15px; border-bottom: 1px solid #dce6ee; }
    .canvas-active .shared-status { order: 0; padding: 4px 2px; font-size: 22px; }
    .canvas-session-title { display: none; min-width: 0; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; color: #365169; font-size: 21px; font-weight: 650; }
    .canvas-active .canvas-session-title { display: inline; }
    .canvas-counts { display: none; align-items: center; justify-content: flex-end; gap: 13px;
      flex: 0 0 auto; margin-left: auto; color: #456076; white-space: nowrap; }
    .canvas-active .canvas-counts { display: flex; }
    .canvas-counts-label { color: #61788b; font-size: 16px; font-weight: 650; }
    .canvas-count { font-size: 17px; font-weight: 650; font-variant-numeric: tabular-nums; }
    .canvas-count strong { margin-left: 4px; color: #203c53; font-size: 19px; font-weight: 750; }
    @media (max-width: 1500px) {
      .canvas-counts { gap: 8px; }
      .canvas-counts-label { display: none; }
      .canvas-count { font-size: 15px; }
      .canvas-count strong { font-size: 17px; }
    }
    .canvas-active .shared-main.canvas-main, html.capture-1920 .canvas-active .shared-main.canvas-main {
      display: grid; grid-template-columns: minmax(0,1fr);
      padding: 18px 0 0; min-height: 0;
    }
    .canvas-stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; border-radius: 20px;
      background: radial-gradient(circle at 50% 45%,#ffffff 0%,#f8fbfe 66%,#f1f6fa 100%);
      border: 1px solid #e2eaf1;
    }
    .canvas-world { position: absolute; z-index: 1; top: 0; left: 0; width: 0; height: 0; transform-origin: 0 0;
      transition: transform .65s cubic-bezier(.2,.7,.25,1); will-change: transform; }
    .canvas-edges { position: absolute; top: 0; left: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none;

    .canvas-edge.opposes { stroke: #a95347; stroke-width: 4; }
    .canvas-node.idea, .canvas-final-marker.idea { --type-accent: #166c84; --type-border: #5d9bb0; --type-tint: #eef8fb; }
    .canvas-node.option, .canvas-final-marker.option { --type-accent: #287545; --type-border: #70aa82; --type-tint: #eff9f1; }
    .canvas-node.concern, .canvas-final-marker.concern { --type-accent: #a94933; --type-border: #cf8c78; --type-tint: #fff3ef; }
    .canvas-node.decision, .canvas-final-marker.decision { --type-accent: #8d5b0b; --type-border: #c49b55; --type-tint: #fff8e8; }
    .canvas-node.open_item, .canvas-final-marker.open_item { --type-accent: #6d4d9f; --type-border: #a78bc7; --type-tint: #f8f3ff; }
    .canvas-node.action, .canvas-final-marker.action { --type-accent: #3158a5; --type-border: #819ad2; --type-tint: #f2f6ff; }
    .canvas-node { position: absolute; transform: translate(-50%,-50%); width: 390px; min-height: 115px;
      padding: 13px 17px; border: 2px solid var(--type-border,#b9cfdd); border-radius: 14px;
      background: var(--type-tint,#fff);
      box-shadow: 0 4px 12px rgba(31,65,95,.055); color: #1e3040; pointer-events: none;
      transition: left .55s cubic-bezier(.2,.7,.25,1), top .55s cubic-bezier(.2,.7,.25,1); }
    .canvas-node .canvas-role { display: inline-block; margin-bottom: 7px; padding: 2px 9px;
      border-radius: 5px; background: var(--type-accent,#49657b); color: #fff;

    .canvas-node .canvas-label { display: block; font-size: 32px; line-height: 1.3; font-weight: 670;

    .canvas-label .canvas-word, .canvas-final-label .canvas-word { white-space: nowrap; }

    .canvas-final-topology circle.concern { fill: #cf8c78; }

      box-shadow: 0 6px 20px rgba(24,47,67,.13); color: #fff; text-align: center; pointer-events: none; }
    .canvas-detail .canvas-detail-time { position: absolute; top: 14px; right: 23px; color: #d5e6ef;
      font-size: 16px; font-weight: 650; font-variant-numeric: tabular-nums; }
    .canvas-detail p { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 5;
      margin: 0 60px; overflow: hidden; font-size: 29px; line-height: 1.38;
      font-weight: 650; overflow-wrap: anywhere; text-wrap: balance; }
    .canvas-detail .detail-overflow { display: none; margin-top: 7px; color: #c6e1f2; font-size: 16px; }
    .canvas-detail.is-overflowing .detail-overflow { display: block; }
    .canvas-detail.just-updated { box-shadow: 0 0 0 2px #9bcce8,0 6px 20px rgba(24,47,67,.13); }
    .canvas-final-note { position: absolute; right: 24px; bottom: 20px; color: #9a4d3b; font-size: 19px; }
    .canvas-empty { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
      color: #526b7d; font-size: 28px; font-weight: 600; }
    @media (prefers-reduced-motion: reduce) {
      .canvas-world, .canvas-node, .canvas-edges { transition: none; }
    }
    .passive { padding: 50px; font-size: 28px; }
  </style>
</head>
<body>
  <div class="shared-shell" aria-label="論点図">
    <header class="shared-header">
      <div class="brand">
        <div class="brand-name">論路</div>
        <div class="brand-goal" id="session-goal">議論の現在地を共有する</div>
      </div>
      <div id="shared-status" class="shared-status">● 待機中</div>
      <div id="canvas-session-title" class="canvas-session-title"></div>
      <div id="canvas-counts" class="canvas-counts" aria-label="論点図の現在有効な項目の分類別件数" hidden></div>
    </header>
    <div class="flow-band">
      <div class="flow-title">話の流れ</div>
      <div class="flow-row"><span class="flow-level">大きな話題</span><div class="flow-list" id="flow-list"></div></div>
      <div class="flow-row flow-discussion"><span class="flow-level">直前の話</span><div class="flow-list" id="discussion-flow-list"></div></div>
    </div>
    <main class="shared-main" id="shared-main">
      <section class="topic-hero">
        <div>
          <div class="topic-kicker">今話していること</div>
          <h1 class="topic-title" id="current-topic">議論の現在地を整理しています</h1>
          <div class="topic-items" id="topic-items"></div>
        </div>
        <div class="past-section">
          <div class="section-label">これまでに話したこと</div>
          <div class="past-topics" id="past-topics"></div>
        </div>
      </section>
      <aside class="side-stack">
        <section class="side-card candidate">
          <h2>決定候補</h2>
          <div class="side-subtitle">まだ確定ではありません</div>
          <div class="confirmed-line" id="confirmed-list" hidden></div>
          <ul class="side-list" id="candidate-list"></ul>
        </section>
        <section class="side-card open">
          <h2>未解決事項</h2>
          <ul class="side-list" id="open-list"></ul>
        </section>
        <section class="side-card action">
          <h2>次の対応</h2>
          <ul class="side-list" id="action-list"></ul>
          <div class="parking-line" id="parking-line" hidden></div>
        </section>
      </aside>
    </main>
    <footer class="shared-footer">
      <div class="footer-note">普段どおりに話してください。論点図は議論とともに更新されます。</div>
      <div class="footer-status" id="footer-status">共有画面</div>
    </footer>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const demoFixture = params.get('fixture');
    const demoSequence = params.get('sequence');
    // Focused Flow is the candidate default; the prior six-card projection
    // remains available as a comparison/fallback, not as the primary meeting view.
    const semanticFocused = params.get('view') !== 'grid';
    const semanticCanvas = params.get('view') !== 'grid' && params.get('view') !== 'focused';
    if (params.get('viewport') === '1920x1080') document.documentElement.classList.add('capture-1920');
    const $ = (id) => document.getElementById(id);
    const HIGHLIGHT_MS = 4500;
    let previousNodeSignatures = null;
    let previousSessionId = null;
    let previousFocusId = null;
    let previousCanvasCamera = null;
    let previousCanvasKey = null;
    let previousCanvasDetailId = null;
    const highlightedUntil = new Map();

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[character]));
    }
    function nodeById(graph, id) { return (graph?.nodes || []).find((node) => node.id === id); }
    function activeNode(node) { return node && !['archived', 'revoked', 'resolved', 'completed'].includes(node.status); }
    function labelForNode(node) { return node?.label || ''; }
    function uniqueNodes(nodes) { return Array.from(new Map(nodes.filter(Boolean).map((node) => [node.id, node])).values()); }
    function updatedNodeIds(graph, sessionId, representations) {
      if (previousSessionId !== sessionId) {
        previousNodeSignatures = null;
        highlightedUntil.clear();
        previousSessionId = sessionId;
        previousFocusId = null;
        previousCanvasCamera = null;
        previousCanvasKey = null;
        previousCanvasDetailId = null;
      }
      const signatures = new Map((graph.nodes || []).map(node => [node.id,
        JSON.stringify([node.label, node.status, node.source_event_ids || [], representations[node.id]?.text || null])]));
      const now = Date.now();
      const focusId = graph.current_topic?.primary_topic_id || null;
      if (previousNodeSignatures) {
        for (const [id, signature] of signatures) {
          if (previousNodeSignatures.get(id) !== signature) highlightedUntil.set(id, now + HIGHLIGHT_MS);
        }
        if (focusId && focusId !== previousFocusId) highlightedUntil.set(focusId, now + HIGHLIGHT_MS);
      }
      previousNodeSignatures = signatures;
      previousFocusId = focusId;
      for (const [id, until] of highlightedUntil) if (until <= now || !signatures.has(id)) highlightedUntil.delete(id);
      return highlightedUntil;
    }

    function statusFor(snapshot, isDemo) {
      const live = snapshot?.live_state || {};
      const state = live.runtime_state || 'idle';
      if (isDemo && state === 'ended') return { text: '● 会議を終了しました', className: 'updated' };
      if (isDemo) return { text: '● 更新しました', className: 'updated' };
      if (live.error || live.queue?.delayed_state === 'critical') return { text: '● 遅れています', className: 'delayed' };
      if (state === 'finalizing') return { text: '● 仕上げています', className: 'busy' };
      if (['capturing', 'active', 'connected'].includes(state)) {
        if (live.websocket_state === 'disconnected') return { text: '● 音声を再接続しています', className: 'busy' };
        if (live.analyzer_status === 'analyzing' || live.stt_state === 'committing') return { text: '● 整理中…', className: 'busy' };
        return { text: '● 聞いています', className: '' };
      }
      if (state === 'ended') return { text: '● 会議を終了しました', className: 'updated' };
      if (state === 'ended_with_incomplete_processing') return { text: '● 終了しました・確認が必要です', className: 'delayed' };
      return { text: '● 待機中', className: '' };
    }

    function renderList(element, nodes, emptyText, limit = 3) {
      const all = uniqueNodes(nodes);
      const values = all.slice(0, limit);
      const remaining = Math.max(0, all.length - values.length);
      element.innerHTML = values.length
        ? values.map((node) => `<li>${escapeHtml(labelForNode(node))}</li>`).join('')
          + (remaining ? `<li class="more-hint">＋ほか${remaining}件</li>` : '')
        : `<li class="side-empty">${escapeHtml(emptyText)}</li>`;
    }

    // Measure actual wrapped text, not character count. Never truncate or hide
    // overflow: unresolved extremes remain detectable at the 36px lower bound.
    function fitDiscussionCards() {
      for (const card of document.querySelectorAll('.discussion-active .topic-item')) {
        const text = card.querySelector('.discussion-label');
        if (!text) continue;
        card.style.paddingBlock = '';
        let fits = false;
        for (const size of [40, 38, 36]) {
          card.style.fontSize = `${size}px`;
          const measure = () => {
            const range = document.createRange(); range.selectNodeContents(text);
            const rects = [...range.getClientRects()].filter(r => r.width > 0);
            const lines = new Set(rects.map(r => Math.round(r.top))).size;
            const style = getComputedStyle(card);
            const available = card.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
            const height = rects.length ? Math.max(...rects.map(r => r.bottom)) - Math.min(...rects.map(r => r.top)) : 0;
            card.dataset.textLines = String(lines);
            return lines <= 5 && height <= available + 1 && text.scrollWidth <= text.clientWidth + 1;
          };
          fits = measure();
          if (!fits && size === 36) {
            // Five 36px lines need ~238px. Recover vertical padding on dense
            // Topic-flow layouts before declaring a genuine capacity issue.
            card.style.paddingBlock = '12px';
            fits = measure();
          }
          if (fits) break;
        }
        card.dataset.textFit = fits ? 'fit' : 'unresolved';
      }
    }

    function priorDiscussion(snapshot) {
      const semantic = snapshot.map.semantic_focus || {};
      const occupiedLabels = new Set([
        semantic.nodes?.find(item => item.position === 'focus')?.label,
        semantic.latest_detail?.canonical,
      ].filter(Boolean).map(value => String(value).trim()));
      return (snapshot.map.recent_discussion_flow || [])
        .filter(item => item.node_id !== semantic.focus_id && item.node_id !== semantic.latest_detail?.id)
        .filter(item => {
          const label = String(item.label).trim();
          if (occupiedLabels.has(label)) return false;
          occupiedLabels.add(label);
          return true;
        })
        .slice(0, 2);
    }

    function renderFocusedFlow(snapshot, nodes, displayText, actionDetails, fresh) {
      const flow = snapshot.map.semantic_focus;
      if (!flow) return null;
      const focus = flow.nodes.find(node => node.position === 'focus');
      const currentTopic = nodes.get(snapshot.state.graph.current_topic?.primary_topic_id);
      const ancestors = flow.nodes.filter(node => node.position === 'ancestor');
      const parents = flow.nodes.filter(node => node.position === 'parent');
      const children = flow.nodes.filter(node => node.position === 'child');
      const descendants = flow.nodes.filter(node => node.position === 'descendant');
      const args = flow.nodes.filter(node => ['argument', 'context'].includes(node.position));
      const priorIds = new Set(priorDiscussion(snapshot).map(item => item.node_id));
      const remainingRecent = (flow.recent_unlinked || []).filter(node => !priorIds.has(node.id));
      const latest = flow.latest_detail;
      const latestAddsDetail = latest && !(focus?.id === latest.id &&
        String(focus.label).trim() === String(latest.canonical).trim());
      const card = (node, extra = '') => `<div class="focused-node ${extra}${fresh.has(node.id) ? ' just-updated' : ''}">${escapeHtml(node.label)}</div>`;
      const row = values => `<div class="focused-row">${values.map(node => card(node)).join('')}</div>`;
      const argument = node => {
        const incoming = flow.argument_edges.find(edge => edge.source_node_id === node.id && edge.target_node_id === focus?.id);
        const outgoing = flow.argument_edges.find(edge => edge.source_node_id === focus?.id && edge.target_node_id === node.id);
        const edge = incoming || outgoing;
        const opposes = edge?.type === 'opposes';
        const caption = incoming ? (opposes ? 'この話への懸念' : 'この話を支える理由')
          : outgoing ? (opposes ? 'この話が反対する案' : 'この話が後押しする案') : 'あわせて出た話';
        return `<div class="focused-node argument${opposes ? ' opposes' : ''}"><div class="focused-argument-label">${caption}</div>${escapeHtml(node.label)}</div>`;
      };
      const persistent = snapshot.map.shared?.rail || {};
      const headings = {candidate:'決定候補',confirmed:'確定事項',open_item:'未解決事項',action:'次の対応'};
      const sections = Object.entries(headings).map(([key,heading]) => {
        const ids = persistent[key]?.node_ids || [];
        if (!ids.length && !['candidate','open_item'].includes(key)) return '';
        return `<section class="persistent-section ${key}"><h2>${heading}</h2>${ids.map(id => {
          const node = nodes.get(id);
          return node ? `<div class="persistent-item${fresh.has(id) ? ' just-updated' : ''}">${escapeHtml(displayText(node))}${actionDetails(node)}</div>` : '';
        }).join('') || '<div class="side-empty">まだありません</div>'}${persistent[key]?.overflow ? `<div class="topic-more">ほか${persistent[key].overflow}件</div>` : ''}</section>`;
      }).join('');
      return `<section class="focused-map" aria-label="今話していること"><h1 class="focused-heading">今話していること</h1><div class="focused-content">
        ${ancestors.length ? `<div class="focused-row">${ancestors.map(node => card(node,'context')).join('')}</div><div class="focused-relation">この話から ┊</div>` : ''}
        ${parents.length ? `${row(parents)}<div class="focused-relation">この話を受けて ┊</div>` : ''}
        ${focus ? `<div class="focused-row">${card(focus,'current')}</div>` : `<div class="focused-row"><div class="focused-node current">${escapeHtml(currentTopic?.label || '議論を整理しています')}</div></div>`}
        ${children.length ? `<div class="focused-relation">┊ ここから出た話</div>${row(children)}` : ''}
        ${descendants.length ? `<div class="focused-relation">┊ その先の話</div><div class="focused-row">${descendants.map(node => card(node,'context')).join('')}</div>` : ''}
        ${args.length ? `<div class="focused-row">${args.map(argument).join('')}</div>` : ''}
        ${remainingRecent.length ? `<div class="focused-unlinked"><h2>最近出た話</h2><div class="focused-unlinked-list">${remainingRecent.map(node => `<div class="focused-unlinked-item${fresh.has(node.id) ? ' just-updated' : ''}">${escapeHtml(node.label)}</div>`).join('')}</div></div>` : ''}</div></section>
        <aside class="focused-side">${latestAddsDetail ? `<section class="focused-latest"><h2>新しく加わったこと</h2><p>${escapeHtml(latest.canonical)}</p></section>` : ''}
        <div class="persistent-rail">${sections}</div></aside>`;
    }

    function canvasRole(node) {
      if (node.type === 'decision') return node.status === 'confirmed' ? '確定事項' : '決定候補';
      return {idea:'視点',option:'案・検討中',concern:'懸念',open_item:'未解決事項',action:'次の対応'}[node.type] || '論点';
    }

    function renderCanvasCounts(canvas) {
      // Whole Canvas, not the camera viewport. Resolved/completed/revoked
      // history remains in the Graph but is not a current meeting item.
      const counts = {idea:0, option:0, concern:0, candidate:0, confirmed:0, open_item:0, action:0};
      for (const node of canvas.nodes) {
        if (['archived','revoked','resolved','completed'].includes(node.status)) continue;
        const key = node.type === 'decision' ? (node.status === 'confirmed' ? 'confirmed' : 'candidate') : node.type;
        if (Object.hasOwn(counts,key)) counts[key]++;
      }
      const labels = {idea:'視点', option:'案', concern:'懸念', candidate:'決定候補',
        confirmed:'確定', open_item:'未解決', action:'次の対応'};
      $('canvas-counts').innerHTML = '<span class="canvas-counts-label">現在の内訳</span>' +
        Object.entries(labels).map(([key,label]) =>
          `<span class="canvas-count" data-count-type="${key}">${label}<strong>${counts[key]}</strong></span>`).join('');
      $('canvas-counts').hidden = false;
    }

    const canvasClockFormat = new Intl.DateTimeFormat('ja-JP', {
      timeZone: 'Asia/Tokyo', hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
    });
    function canvasTimeMarkup(node, className = 'canvas-time') {
      const source = node?.time_at;
      if (typeof source !== 'string' || !/(?:Z|[+-]\d{2}:\d{2})$/.test(source)) return '';
      const instant = new Date(source);
      if (!Number.isFinite(instant.getTime())) return '';
      return `<time class="${className}" datetime="${escapeHtml(source)}">${escapeHtml(canvasClockFormat.format(instant))}</time>`;
    }

    function canvasTransform(camera, stage, hasDetail) {
      const anchorY = stage.clientHeight * (hasDetail ? .45 : .5);
      return `translate(${stage.clientWidth / 2}px,${anchorY}px) scale(${camera.scale}) translate(${-camera.x}px,${-camera.y}px)`;
    }

    function canvasArrowDefs(prefix) {
      return `<defs>
        <marker id="${prefix}-provenance" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#547d9c" stroke-width="3"/></marker>
        <marker id="${prefix}-supports" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L10 6 L2 10 Z" fill="#2d7b54"/></marker>
        <marker id="${prefix}-opposes" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L10 6 L2 10 L5 6 Z" fill="#a95347"/></marker>
      </defs>`;
    }

    const canvasWordSegmenter = typeof Intl.Segmenter === 'function'
      ? new Intl.Segmenter('ja', {granularity:'word'}) : null;
    function canvasDisplayLabelMarkup(label) {
      if (!canvasWordSegmenter) return escapeHtml(label);
      return [...canvasWordSegmenter.segment(label)].map(part => {
        const escaped = escapeHtml(part.segment);
        // Keep ordinary Japanese terms intact; very long tokens remain
        // breakable so one unusual label cannot overflow its card.
        return part.isWordLike && [...part.segment].length <= 8
          ? `<span class="canvas-word">${escaped}</span>` : escaped;
      }).join('');
    }

    function canvasBorderPoint(from, toward, width, height, gap = 5) {
      const dx = toward.x-from.x, dy = toward.y-from.y;
      if (!dx && !dy) return from;
      const distance = Math.min(dx ? (width/2+gap)/Math.abs(dx) : Infinity,
        dy ? (height/2+gap)/Math.abs(dy) : Infinity);
      return {x:from.x+dx*distance,y:from.y+dy*distance};
    }

    function canvasArrowLine(edge, start, end, prefix, live = false) {
      if (Math.hypot(end.x-start.x,end.y-start.y) < 15) return '';
      const type = edge.type === 'discussion_provenance' ? 'provenance' : edge.type;
      return `<line class="${live ? 'canvas-edge ' : ''}${escapeHtml(type)}" data-source="${escapeHtml(edge.source_node_id)}" data-target="${escapeHtml(edge.target_node_id)}" x1="${start.x}" y1="${start.y}" x2="${end.x}" y2="${end.y}" marker-end="url(#${prefix}-${type})"/>`;
    }

    function canvasArrowLines(edges, byId, sizes, prefix, live = false) {
      const geometry = edges.map(edge => {
        const source = byId.get(edge.source_node_id), target = byId.get(edge.target_node_id);
        const sourceSize = sizes.get(edge.source_node_id), targetSize = sizes.get(edge.target_node_id);
        return {edge, source, target, sourceSize, targetSize,
          start:canvasBorderPoint(source,target,sourceSize.width,sourceSize.height),
          end:canvasBorderPoint(target,source,targetSize.width,targetSize.height)};
      });
      const ports = new Map();
      for (const item of geometry) {
        for (const [node,other,size,point] of [[item.source,item.target,item.sourceSize,item.start],
          [item.target,item.source,item.targetSize,item.end]]) {
          const dx=other.x-node.x, dy=other.y-node.y;
          const side=Math.abs(dx)/(size.width/2) >= Math.abs(dy)/(size.height/2)
            ? (dx>=0 ? 'right' : 'left') : (dy>=0 ? 'bottom' : 'top');
          const key=`${node.node?.id || node.id}:${side}`;
          if (!ports.has(key)) ports.set(key,[]);
          ports.get(key).push({item,point,node,size,side,other});
        }
      }
      for (const group of ports.values()) {
        if (group.length < 2) continue;
        const horizontal = group[0].side === 'top' || group[0].side === 'bottom';
        group.sort((a,b) => (horizontal ? a.other.x-b.other.x : a.other.y-b.other.y) ||
          a.item.edge.id.localeCompare(b.item.edge.id));
        const half=(horizontal ? group[0].size.width : group[0].size.height)/2;
        const step=Math.min(28,Math.max(0,(half-18)/((group.length-1)/2)));
        group.forEach(({point,node},index) => {
          const offset=(index-(group.length-1)/2)*step;
          if (horizontal) point.x=node.x+offset;
          else point.y=node.y+offset;
        });
      }
      return geometry.map(item => canvasArrowLine(item.edge,item.start,item.end,prefix,live)).join('');
    }

    function canvasProperCross(a,b,c,d) {
      const orient=(p,q,r) => (q.x-p.x)*(r.y-p.y)-(q.y-p.y)*(r.x-p.x);
      const ab1=orient(a,b,c), ab2=orient(a,b,d), cd1=orient(c,d,a), cd2=orient(c,d,b);
      return ab1*ab2 < -1 && cd1*cd2 < -1;
    }

    function canvasLineCrossesCard(a,b,card,size) {
      const left=card.x-size.width/2-7, right=card.x+size.width/2+7;
      const top=card.y-size.height/2-7, bottom=card.y+size.height/2+7;
      const corners=[{x:left,y:top},{x:right,y:top},{x:right,y:bottom},{x:left,y:bottom}];
      return corners.some((corner,index) =>
        canvasProperCross(a,b,corner,corners[(index+1)%4]));
    }

    function canvasImproveFinalCrossings(placed, edges, sizes, width, height) {
      const byId=new Map(placed.map(item => [item.node.id,item]));
      const shown=edges.filter(edge => byId.has(edge.source_node_id) && byId.has(edge.target_node_id));
      const crossingScore=() => shown.reduce((count,edge,index) => {
        const a=byId.get(edge.source_node_id), b=byId.get(edge.target_node_id);
        const obscured=placed.filter(item => item!==a && item!==b &&
          canvasLineCrossesCard(a,b,item,sizes.get(item.node.id))).length;
        const crossed=shown.slice(index+1).filter(other => {
          if ([edge.source_node_id,edge.target_node_id].some(id =>
            id===other.source_node_id || id===other.target_node_id)) return false;
          return canvasProperCross(a,b,byId.get(other.source_node_id),byId.get(other.target_node_id));
        }).length;
        return count+obscured*10+crossed;
      },0);
      const offsets=[[-320,0],[320,0],[0,-180],[0,180],[-320,-180],[320,-180],[-320,180],[320,180]];
      for (let pass=0; pass<2; pass++) {
        const baseline=crossingScore();
        if (!baseline) break;
        let best=null;
        for (const item of placed) {
          const size=sizes.get(item.node.id);
          const original={x:item.x,y:item.y};
          for (const [dx,dy] of offsets) {
            const x=original.x+dx, y=original.y+dy;
            if (x-size.width/2<14 || x+size.width/2>width-14 ||
                y-size.height/2<14 || y+size.height/2>height-14) continue;
            if (placed.some(other => other!==item &&
              Math.abs(other.x-x)<(size.width+sizes.get(other.node.id).width)/2+12 &&
              Math.abs(other.y-y)<(size.height+sizes.get(other.node.id).height)/2+12)) continue;
            item.x=x; item.y=y;
            const remaining=crossingScore();
            item.x=original.x; item.y=original.y;
            const travel=Math.hypot(dx,dy);
            if (remaining<baseline && (!best || remaining<best.remaining ||
                (remaining===best.remaining && travel<best.travel))) best={item,x,y,remaining,travel};
          }
        }
        if (!best) break;
        best.item.x=best.x; best.item.y=best.y;
      }
    }

    function finalOverviewIds(canvas) {
      const byId = new Map(canvas.nodes.map(node => [node.id,node]));
      const outgoing = new Map();
      const degree = new Map();
      for (const edge of canvas.edges) {
        degree.set(edge.source_node_id,(degree.get(edge.source_node_id)||0)+1);
        degree.set(edge.target_node_id,(degree.get(edge.target_node_id)||0)+1);
        if (edge.type === 'discussion_provenance') {
          if (!outgoing.has(edge.source_node_id)) outgoing.set(edge.source_node_id,[]);
          outgoing.get(edge.source_node_id).push(edge.target_node_id);
        }
      }
      const byCreation = (a,b) => a.created_sequence-b.created_sequence || a.id.localeCompare(b.id);
      const selected = [];
      const add = id => { if (byId.has(id) && !selected.includes(id)) selected.push(id); };
      const stateNodes = canvas.nodes.filter(node => ['decision','open_item','action'].includes(node.type))
        .sort((a,b) => ({decision:0,open_item:1,action:2}[a.type] -
                        {decision:0,open_item:1,action:2}[b.type]) || byCreation(a,b));
      stateNodes.slice(0,4).forEach(node => add(node.id));
      const independent = canvas.nodes.filter(node => node.root_state === 'independent').sort(byCreation);
      const entryCandidates = canvas.nodes.filter(node => node.root_state === 'unconfirmed')
        .sort((a,b) => Number(outgoing.has(b.id))-Number(outgoing.has(a.id)) || byCreation(a,b));
      const entries = [...independent.slice(0,2), ...entryCandidates.slice(0,3)];
      entries.forEach(node => add(node.id));
      // One nearby branch point per entry conveys structure without claiming
      // that every no-parent Node is an independently verified Root.
      for (const entry of entries) {
        const child = (outgoing.get(entry.id)||[]).map(id => byId.get(id)).filter(Boolean)
          .sort((a,b) => (degree.get(b.id)||0)-(degree.get(a.id)||0) || byCreation(a,b))[0];
        if (child) add(child.id);
      }
      if (canvas.nodes.length <= 12) canvas.nodes.slice().sort(byCreation).forEach(node => add(node.id));
      return selected.slice(0,12);
    }

    function renderSemanticCanvas(snapshot, graph, fresh) {
      const canvas = snapshot.map.semantic_canvas;
      const state = snapshot?.live_state?.runtime_state || 'active';
      const final = state === 'ended';
      const camera = final ? canvas.final_camera : canvas.live_camera;
      const byId = new Map(canvas.nodes.map(node => [node.id,node]));
      const near = new Set(canvas.near_ids);
      const focus = byId.get(canvas.focus_id);
      const visible = final ? finalOverviewIds(canvas).map(id => byId.get(id)).filter(Boolean)
        : canvas.near_ids.map(id => byId.get(id)).filter(Boolean);
      const visibleIds = new Set(visible.map(node => node.id));
      const nodeMarkup = (final ? [] : visible).map(node => {
        const isFocus = !final && node.id === canvas.focus_id;
        const soft = final || !near.has(node.id);
        const stateClass = node.type === 'decision' && node.status === 'confirmed' ? ' confirmed' : '';
        return `<div class="canvas-node ${escapeHtml(node.type)}${stateClass} ${isFocus ? 'focus' : soft ? 'mid' : ''} ${node.root_state === 'unconfirmed' ? 'unconfirmed' : ''}" style="left:${node.x}px;top:${node.y}px" data-node-id="${escapeHtml(node.id)}"><span class="canvas-role">${escapeHtml(canvasRole(node))}</span>${canvasTimeMarkup(node)}<span class="canvas-label">${canvasDisplayLabelMarkup(node.label)}</span></div>`;
      }).join('');
      const detail = !final && focus ? `<aside class="canvas-detail${fresh.has(focus.id) ? ' just-updated' : ''}">${canvasTimeMarkup(focus, 'canvas-detail-time')}<p>${escapeHtml(focus.canonical)}</p><div class="detail-overflow">続きあり</div></aside>` : '';
      const note = state === 'ended_with_incomplete_processing' ? '処理が完了していません。内容の確認が必要です。'
        : '';
      const markup = `<section class="canvas-stage" aria-label="議論の論点図"><div class="canvas-world"><svg class="canvas-edges" aria-hidden="true"></svg>${nodeMarkup}</div><div class="canvas-periphery"></div><svg class="canvas-final-topology" aria-hidden="true"></svg><svg class="canvas-final-relations" aria-hidden="true"></svg><div class="canvas-final-markers"></div>${canvas.nodes.length ? '' : '<div class="canvas-empty">議論を整理しています</div>'}${note ? `<div class="canvas-final-note">${note}</div>` : ''}${detail}</section>`;
      const main = $('shared-main');
      const key = JSON.stringify([canvas.session_id,canvas.revision,state,canvas.focus_id,
        canvas.latest_detail_id,snapshot.map.display_labels]);
      if (key === previousCanvasKey) return;
      previousCanvasKey = key;
      const priorPositions = new Map([...main.querySelectorAll('.canvas-node')].map(element => {
        const style = getComputedStyle(element);
        return [element.dataset.nodeId,{x:parseFloat(style.left),y:parseFloat(style.top)}];
      }));
      main.classList.add('canvas-main');
      main.classList.toggle('final',final);
      main.classList.remove('focused-main','focused-sparse','no-rail');
      main.innerHTML = markup;
      const stage = main.querySelector('.canvas-stage');
      const world = main.querySelector('.canvas-world');
      if (!stage || !world) return;
      const moving=[];
      if (!final && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
        for (const node of visible) {
          const prior=priorPositions.get(node.id);
          if (!prior || !Number.isFinite(prior.x) || !Number.isFinite(prior.y) ||
              Math.hypot(prior.x-node.x,prior.y-node.y)<1) continue;
          const element=[...world.querySelectorAll('.canvas-node')]
            .find(card => card.dataset.nodeId===node.id);
          if (!element) continue;
          element.style.left=`${prior.x}px`;
          element.style.top=`${prior.y}px`;
          moving.push({element,x:node.x,y:node.y});
        }
      }
      if (!final) {
        const cards = new Map([...world.querySelectorAll('.canvas-node')].map(element =>
          [element.dataset.nodeId, {width:element.offsetWidth,height:element.offsetHeight}]));
        main.querySelector('.canvas-edges').innerHTML = canvasArrowDefs('canvas-live-arrow') +
          canvasArrowLines(canvas.edges.filter(edge => visibleIds.has(edge.source_node_id) &&
            visibleIds.has(edge.target_node_id)),byId,cards,'canvas-live-arrow',true);
        if (moving.length) main.querySelector('.canvas-edges').classList.add('reflowing');
      }
      const oldCamera = previousCanvasCamera;
      world.style.transition = 'none';
      world.style.transform = canvasTransform(oldCamera || camera,stage,Boolean(detail));
      // Layout and camera target are deterministic; interpolation is visual only.
      requestAnimationFrame(() => requestAnimationFrame(() => {
        world.style.transition = '';
        world.style.transform = canvasTransform(camera,stage,Boolean(detail));
        for (const {element,x,y} of moving) {
          element.style.left=`${x}px`;
          element.style.top=`${y}px`;
        }
        if (moving.length) setTimeout(() =>
          main.querySelector('.canvas-edges')?.classList.remove('reflowing'),560);
      }));
      previousCanvasCamera = camera;
      previousCanvasDetailId = focus?.id || null;
      const detailText = main.querySelector('.canvas-detail p');
      if (detailText && detailText.scrollHeight > detailText.clientHeight + 2) {
        detailText.closest('.canvas-detail').classList.add('is-overflowing');
      }
      if (!final && focus) {
        const outside = canvas.nodes.filter(node => !visibleIds.has(node.id) &&
          node.root_state !== 'linked' && node.id !== canvas.focus_id)
          .sort((a,b) => Math.hypot(a.x-camera.x,a.y-camera.y)-Math.hypot(b.x-camera.x,b.y-camera.y))
          .slice(0,5);
        const periphery = main.querySelector('.canvas-periphery');
        const peripheralSlots = [[.12,.18],[.84,.19],[.12,.75],[.84,.75],[.50,.10]];
        const usedSlots = new Set();
        periphery.innerHTML = outside.map(node => {
          const dx = (node.x-camera.x)*camera.scale, dy = (node.y-camera.y)*camera.scale;
          const preferred = Math.abs(dy)>Math.abs(dx) ? (dy>0 ? 2 : 4) : (dx>0 ? 1 : 0);
          let slot = preferred;
          while (usedSlots.has(slot)) slot=(slot+1)%peripheralSlots.length;
          usedSlots.add(slot);
          const [slotX,slotY] = peripheralSlots[slot];
          const x = stage.clientWidth*slotX, y = stage.clientHeight*slotY;
          return `<div class="canvas-peripheral ${node.root_state === 'unconfirmed' ? 'unconfirmed' : ''}" style="left:${x}px;top:${y}px">${escapeHtml(node.label)}</div>`;
        }).join('');
      } else if (final) {
        const topology = main.querySelector('.canvas-final-topology');
        topology.setAttribute('viewBox',`0 0 ${stage.clientWidth} ${stage.clientHeight}`);
        const bins = new Map();
        for (const node of canvas.nodes) {
          const x = stage.clientWidth/2 + (node.x-camera.x)*camera.scale;
          const y = stage.clientHeight/2 + (node.y-camera.y)*camera.scale;
          if (x<10 || x>stage.clientWidth-10 || y<10 || y>stage.clientHeight-10) continue;
          const bx=Math.floor(x/24), by=Math.floor(y/24), key=`${bx}:${by}`;
          const current=bins.get(key);
          if (current) { current.count++; if (['decision','action','open_item'].includes(node.type)) current.type=node.type; }
          else bins.set(key,{x,y,count:1,type:node.type});
        }
        topology.innerHTML = [...bins.values()].map(item => `<circle class="${escapeHtml(item.type)}" cx="${item.x}" cy="${item.y}" r="${Math.min(12,4+Math.sqrt(item.count)*2)}"/>`).join('');
        const markers = main.querySelector('.canvas-final-markers');
        const relations = main.querySelector('.canvas-final-relations');
        relations.setAttribute('viewBox',`0 0 ${stage.clientWidth} ${stage.clientHeight}`);
        const used = [];
        const candidates = visible.map(node => {
          const sx = stage.clientWidth/2 + (node.x-camera.x)*camera.scale;
          const sy = stage.clientHeight/2 + (node.y-camera.y)*camera.scale;
          return {node,x:sx,y:sy};
        });
        const offsets = [[0,0],[-320,0],[320,0],[0,-180],[0,180],
          [-320,-180],[320,-180],[-320,180],[320,180],[-640,0],[640,0]];
        const placed = [];
        for (const {node,x,y} of candidates) {
          for (const [dx,dy] of offsets) {
            const px=x+dx, py=y+dy;
            if (px<145 || px>stage.clientWidth-145 || py<95 || py>stage.clientHeight-115) continue;
            if (used.some(point => Math.abs(point.x-px)<310 && Math.abs(point.y-py)<160)) continue;
            used.push({x:px,y:py});
            placed.push({node,x:px,y:py});
            break;
          }
          if (placed.length>=9) break;
        }
        const markerById = new Map(placed.map(item => [item.node.id,item]));
        markers.innerHTML = placed.map(({node,x,y}) => {
          const rootClass = node.root_state === 'linked' ? '' : ` ${node.root_state}`;
          return `<div class="canvas-final-marker ${escapeHtml(node.type)}${rootClass}" data-node-id="${escapeHtml(node.id)}" style="left:${x}px;top:${y}px"><small>${escapeHtml(canvasRole(node))}</small>${canvasTimeMarkup(node)}<span class="canvas-final-label">${canvasDisplayLabelMarkup(node.label)}</span></div>`;
        }).join('');
        const markerSizes = new Map([...markers.querySelectorAll('.canvas-final-marker')].map(element =>
          [element.dataset.nodeId, {width:element.offsetWidth,height:element.offsetHeight}]));
        canvasImproveFinalCrossings(placed,canvas.edges,markerSizes,stage.clientWidth,stage.clientHeight);
        for (const item of placed) {
          const marker=markers.querySelector(`[data-node-id="${CSS.escape(item.node.id)}"]`);
          marker.style.left=`${item.x}px`;
          marker.style.top=`${item.y}px`;
        }
        relations.innerHTML = canvasArrowDefs('canvas-final-arrow') +
          canvasArrowLines(canvas.edges.filter(edge => markerById.has(edge.source_node_id) &&
            markerById.has(edge.target_node_id)),markerById,markerSizes,'canvas-final-arrow');
      }
    }
    window.addEventListener('resize', fitDiscussionCards);
    document.fonts.ready.then(fitDiscussionCards);

    function renderShared(snapshot, isDemo = false) {
      const graph = snapshot?.state?.graph;
      const shared = snapshot?.map?.shared;
      const state = snapshot?.live_state?.runtime_state || (isDemo ? 'active' : 'idle');
      const ready = Boolean(graph && shared);
      const idle = !ready || state === 'idle';
      document.querySelector('.shared-shell').classList.toggle('discussion-active', !idle);
      document.querySelector('.shared-shell').classList.toggle('canvas-active', !idle && semanticCanvas && Boolean(snapshot?.map?.semantic_canvas));
      const status = statusFor(snapshot, isDemo);
      $('shared-status').textContent = state === 'starting' ? '● 準備しています' : status.text;
      $('shared-status').className = `shared-status ${status.className}`;
      const main = $('shared-main');
      if (idle) {
        $('canvas-counts').hidden = true;
        previousNodeSignatures = null;
        highlightedUntil.clear();
        previousFocusId = null;
        previousCanvasCamera = null;
        previousCanvasKey = null;
        main.classList.add('no-rail');
        main.classList.remove('focused-main', 'focused-sparse');
        main.innerHTML = '<section class="passive"><h1>会議の開始を待っています</h1><p>スマートフォンで <a href="/session">会議をはじめる</a></p></section>';
        $('flow-list').innerHTML = '';
        $('discussion-flow-list').innerHTML = '';
        document.querySelector('.flow-band').hidden = true;
        return;
      }
      const nodes = new Map(graph.nodes.map(n => [n.id, n]));
      const representations = snapshot.map.display_labels || {};
      const fresh = updatedNodeIds(graph, snapshot?.state?.session?.id || snapshot?.state?.graph?.session_id || 'demo', representations);
      if (semanticCanvas && snapshot.map.semantic_canvas) {
        renderCanvasCounts(snapshot.map.semantic_canvas);
        const title = snapshot?.state?.session?.title || '';
        $('canvas-session-title').textContent = title && !/Live Audio Continuous Session/i.test(title) ? `｜ ${title}` : '';
        document.querySelector('.flow-band').hidden = true;
        document.querySelector('.shared-shell').classList.remove('has-flow','has-discussion');
        renderSemanticCanvas(snapshot,graph,fresh);
        return;
      }
      $('canvas-counts').hidden = true;
      const displayText = node => representations[node?.id]?.text || node?.label || '';
      const actionDetails = node => {
        if (node?.type !== 'action') return '';
        const action = node.action || {};
        const details = [action.owner ? `担当：${action.owner}` : '', action.due_date ? `期限：${action.due_date}` : ''].filter(Boolean);
        return details.length ? `<div class="action-details">${details.map(escapeHtml).join(' ／ ')}</div>` : '';
      };
      const cards = shared.slots.map(id => {
        const node = nodes.get(id);
        return node ? `<article class="topic-item ${escapeHtml(node.type)}${fresh.has(id) ? ' just-updated' : ''}"><span class="discussion-label">${escapeHtml(displayText(node))}</span></article>`
          : '<div class="empty-slot" aria-hidden="true"></div>';
      }).join('');
      const headings = {candidate: '決定候補', confirmed: '確定事項', open_item: '未解決事項', action: '次の対応'};
      const rail = Object.entries(shared.rail).filter(([,value]) => value.node_ids.length);
      const focusedMarkup = semanticFocused ? renderFocusedFlow(snapshot, nodes, displayText, actionDetails, fresh) : null;
      main.classList.toggle('no-rail', !rail.length && !focusedMarkup);
      main.classList.toggle('focused-main', Boolean(focusedMarkup));
      main.classList.toggle('focused-sparse', Boolean(focusedMarkup && (snapshot.map.semantic_focus?.nodes.length || 0) <= 2));
      main.innerHTML = focusedMarkup || `<section class="current-discussion" aria-label="今話していること"><div class="topic-items">${cards}</div>
        <div class="topic-more">${shared.overflow ? 'ほか'+shared.overflow+'件' : ''}</div></section>`
        + (rail.length ? `<aside class="persistent-rail">${rail.map(([key,value]) =>
          `<section class="persistent-section ${key}"><h2>${headings[key]}</h2>
            ${value.node_ids.map(id => `<div class="persistent-item${fresh.has(id) ? ' just-updated' : ''}">${escapeHtml(displayText(nodes.get(id)))}${actionDetails(nodes.get(id))}</div>`).join('')}
            ${value.overflow ? `<div class="topic-more">ほか${value.overflow}件</div>` : ''}</section>`).join('')}</aside>` : '');
      // Only actual canonical focus transitions; never infer a Topic from card capacity.
      const generic = label => ['その他','未分類','other','others','misc','other discussion items'].includes(String(label).trim().toLowerCase());
      const flow = (snapshot.map.recent_flow || []).filter(item => nodes.has(item.topic_id) && !generic(item.label));
      const meaningfulFlow = new Set(flow.map(item => item.topic_id)).size > 1;
      const discussion = priorDiscussion(snapshot);
      const showFlow = focusedMarkup ? (flow.length > 0 || discussion.length > 0) : meaningfulFlow;
      document.querySelector('.flow-band').hidden = !showFlow;
      document.querySelector('.shared-shell').classList.toggle('has-flow', showFlow);
      document.querySelector('.shared-shell').classList.toggle('has-discussion', Boolean(discussion.length));
      document.querySelector('.flow-band').classList.toggle('has-discussion', Boolean(discussion.length));
      document.querySelector('.flow-discussion').hidden = !discussion.length;
      // Presentation only: newest/current at the fixed left edge; history stays chronological upstream.
      const recent = flow.slice(-4).reverse();
      $('flow-list').innerHTML = showFlow ? recent.map((item,index) =>
        `${index ? '<span class="flow-arrow">←</span>' : ''}<span class="flow-item${index === 0 && item.topic_id === graph.current_topic?.primary_topic_id ? ' current' : ''}${index === 0 && fresh.has(item.topic_id) ? ' just-updated' : ''}">${escapeHtml(item.label)}</span>`).join('') : '';
      $('discussion-flow-list').innerHTML = discussion.map((item,index) =>
        `${index ? '<span class="flow-arrow">←</span>' : ''}<span class="flow-item${fresh.has(item.node_id) ? ' just-updated' : ''}">${escapeHtml(item.label)}</span>`).join('');
      fitDiscussionCards();
    }

    async function fetchDemo() {
      const fixture = encodeURIComponent(demoFixture || '001');
      const query = demoSequence === null ? '?mode=events' : `?mode=events&sequence=${encodeURIComponent(demoSequence)}`;
      const response = await fetch(`/api/sessions/${fixture}${query}`, { cache: 'no-store' });
      if (!response.ok) throw new Error('demo snapshot unavailable');
      return response.json();
    }

    async function fetchLive() {
      const response = await fetch('/api/live', { cache: 'no-store' });
      if (!response.ok) throw new Error('live snapshot unavailable');
      return response.json();
    }

    async function refresh() {
      try {
        const snapshot = demoFixture ? await fetchDemo() : await fetchLive();
        renderShared(snapshot, Boolean(demoFixture));
      } catch (_) {
        if (!demoFixture) {
          $('shared-status').textContent = '● 接続を確認しています';
          $('shared-status').className = 'shared-status delayed';
        }
      }
    }
    refresh();
    if (!demoFixture) window.setInterval(refresh, 1000);
  </script>
</body>
</html>
