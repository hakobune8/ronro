apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ronro-pilot

resources:
  - ../../base

images:
  - name: registry.example.invalid/ronro
    newName: ghcr.io/hakobune8/ronro
    digest: sha256:19dc636509c2215c34b4d4108fd25967094c24c05610dba168c1a334b248f77f

patches:
  - path: deployment-patch.yaml
  - path: service-patch.yaml
  - path: ingress-patch.yaml
  # Keep the edge-cluster EndpointSlice's fixed NodePort contract.
  - target:
      version: v1
      kind: Service
      name: ronro-pilot
    patch: |-
      - op: add
        path: /spec/ports/0/nodePort
        value: 30100
      - op: add
        path: /spec/ports/1/nodePort
        value: 30101
