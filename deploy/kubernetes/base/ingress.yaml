apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: discussion-map-pilot
  labels:
    app.kubernetes.io/name: discussion-map-ai-facilitator
  annotations:
    # These annotations are for ingress-nginx. Set ingressClassName and
    # annotations in the pilot overlay to match the installed controller.
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "1200"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "1200"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - discussion-map-pilot.example.invalid
      secretName: discussion-map-pilot-tls
  rules:
    - host: discussion-map-pilot.example.invalid
      http:
        paths:
          - path: /live
            pathType: Prefix
            backend:
              service:
                name: discussion-map-pilot
                port:
                  name: websocket
          - path: /
            pathType: Prefix
            backend:
              service:
                name: discussion-map-pilot
                port:
                  name: http
