apiVersion: apps/v1
kind: Deployment
metadata:
  name: ronro-pilot
  labels:
    app.kubernetes.io/name: ronro
    app.kubernetes.io/part-of: ronro-pilot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ronro
      app.kubernetes.io/part-of: ronro-pilot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ronro
        app.kubernetes.io/part-of: ronro-pilot
        app.kubernetes.io/configuration: semantic-graph-rc4
    spec:
      terminationGracePeriodSeconds: 60
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ronro
          image: registry.example.invalid/ronro:pilot-001
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: websocket
              containerPort: 8765
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ronro-pilot-config
            - secretRef:
                name: ronro-openai
          env:
            - name: APP_VERSION
              value: casual-session-rc1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: evaluation
              mountPath: /data/evaluation
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: evaluation
          persistentVolumeClaim:
            claimName: ronro-pilot-evaluation
        - name: tmp
          emptyDir: {}
