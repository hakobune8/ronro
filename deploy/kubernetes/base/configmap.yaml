apiVersion: v1
kind: ConfigMap
metadata:
  name: discussion-map-pilot-config
  labels:
    app.kubernetes.io/name: discussion-map-ai-facilitator
    app.kubernetes.io/component: runtime-config
data:
  RUNTIME_ENVIRONMENT: pilot
  LIVE_CONFIGURATION_VERSION: semantic-graph-rc2
  PROMPT_VERSION: analyzer-prompt-v9-semantic-edge-balance
  REAL_ANALYZER_OUTPUT_SCHEMA_VERSION: v3
  NORMALIZATION_VERSION: v2
  CONTEXT_VERSION: v1
  TYPE_D: "OFF"
  PRESENTATION_COMPACTION: "ON"
  OPEN_ITEM_LIFECYCLE: "ON"
  RENDER_COALESCING_SECONDS: "2"
  DRAIN_TIMEOUT_SECONDS: "30"

  OPENAI_BASE_URL: https://api.openai.com/v1
  OPENAI_REALTIME_ENDPOINT: wss://api.openai.com/v1/realtime?intent=transcription
  OPENAI_REALTIME_STT_MODEL: gpt-transcribe
  OPENAI_REALTIME_LANGUAGE: ja
  OPENAI_REALTIME_TIMEOUT_SECONDS: "45"
  OPENAI_REALTIME_PROMPT: "日本語の会議・打ち合わせの音声です。発話内容を忠実に文字起こしし、音声として確認できない内容を補完しないでください。"
  OPENAI_REALTIME_KEYWORDS: '["論路"]'
  OPENAI_REALTIME_FINALIZATION_MODE: server_vad_bounded
  OPENAI_REALTIME_PERIODIC_COMMIT_SECONDS: "30"

  REAL_ANALYZER_MODEL: gpt-5.6-luna
  REAL_ANALYZER_REASONING_EFFORT: medium
  REAL_ANALYZER_TIMEOUT_SECONDS: "45"

  EVALUATION_ROOT: /data/evaluation/live/sessions
  EVALUATION_REPORT_ROOT: /data/evaluation/live/reports
  LIVE_WEBSOCKET_PATH: /live
